<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Спросите Петра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ===== НАСТРОЙКИ ВНЕШНЕГО ВИДА ===== */
  :root {
    --emerald: rgba(10, 48, 34, 0.84);
    --emerald-hi: rgba(18, 74, 52, 0.92);
    --gold: #c9a24a;
    --gold-light: #f0d48a;
    --text: #f5e9c8;
    --fade: 450ms;           /* скорость плавных переходов */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: none;             /* сенсорный экран: курсор не нужен */
  }

  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  #answer {
    opacity: 0;
    transition: opacity var(--fade) ease;
  }
  #answer.visible { opacity: 1; }

  /* ===== КНОПКИ ===== */
  .question {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 27vw;
    min-height: 13vw;
    padding: 2.2vw 2.4vw;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 2.3vw;
    line-height: 1.2;
    color: var(--text);
    text-shadow: 0 0.1vw 0.3vw rgba(0,0,0,0.6);
    background: var(--emerald);
    border: 0.18vw solid var(--gold);
    border-radius: 1vw;
    box-shadow:
      inset 0 0 0 0.45vw rgba(0,0,0,0),
      inset 0 0 0 0.55vw rgba(201,162,74,0.55),
      0 0.8vw 2.5vw rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    outline: none;
    cursor: none;
    transition: opacity var(--fade) ease, transform 150ms ease,
                background 150ms ease, box-shadow 150ms ease;
    animation: invite 3.2s ease-in-out infinite;
  }
  #q-left  { left: 4vw; }
  #q-right { right: 4vw; animation-delay: 1.6s; }

  /* золотые ромбики по углам */
  .question::before, .question::after {
    content: "";
    position: absolute;
    width: 1vw; height: 1vw;
    background: var(--gold);
    transform: rotate(45deg);
    top: 50%; margin-top: -0.5vw;
  }
  .question::before { left: -0.6vw; }
  .question::after  { right: -0.6vw; }

  /* нажатие */
  .question:active, .question.pressed {
    background: var(--emerald-hi);
    transform: translateY(-50%) scale(0.96);
    box-shadow:
      inset 0 0 0 0.55vw rgba(240,212,138,0.8),
      0 0 3vw rgba(240,212,138,0.55);
  }

  /* мягкое свечение, приглашающее нажать */
  @keyframes invite {
    0%, 100% { box-shadow: inset 0 0 0 0.55vw rgba(201,162,74,0.55), 0 0.8vw 2.5vw rgba(0,0,0,0.55); }
    50%      { box-shadow: inset 0 0 0 0.55vw rgba(240,212,138,0.8), 0 0 2.2vw rgba(240,212,138,0.35); }
  }

  /* во время ответа кнопки скрыты */
  body.playing .question {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<video id="bg" autoplay loop muted playsinline preload="auto"></video>
<video id="answer" playsinline preload="auto"></video>

<button class="question" id="q-left"  data-video="Окно в европу.mp4">Зачем вы построили Петербург на болотах?</button>
<button class="question" id="q-right" data-video="Голландия.mp4">Как вы создали российский флот?</button>

<script>
  /* ===== НАСТРОЙКИ ===== */
  const BG_VIDEO = "Фоновое.mp4";   // фоновая петля
  const BG_VOLUME = 1.0;            // громкость фона (0…1)
  const FADE_MS = 450;              // совпадает с --fade в CSS

  const bg = document.getElementById("bg");
  const answer = document.getElementById("answer");
  const buttons = document.querySelectorAll(".question");
  let busy = false;
  let soundUnlocked = false;

  const src = name => encodeURI(name);

  bg.src = src(BG_VIDEO);
  bg.volume = BG_VOLUME;
  bg.play().catch(() => {});

  // Предзагрузка ответов, чтобы старт был мгновенным
  buttons.forEach(b => {
    const v = document.createElement("video");
    v.preload = "auto"; v.muted = true; v.src = src(b.dataset.video);
  });

  // Браузер разрешает звук только после первого касания.
  // Первое касание в любом месте экрана включает звук фона.
  function unlockSound() {
    if (soundUnlocked) return;
    soundUnlocked = true;
    bg.muted = false;
    bg.play().catch(() => {});
  }
  document.addEventListener("pointerdown", unlockSound, { capture: true });

  let fadeId = 0;
  function fadeVolume(el, to, ms) {
    const id = ++fadeId;                         // новый переход отменяет старый
    const from = el.volume, start = performance.now();
    function step(t) {
      if (id !== fadeId) return;
      const k = Math.min(1, Math.max(0, (t - start) / ms));
      el.volume = Math.min(1, Math.max(0, from + (to - from) * k));
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function playAnswer(file) {
    if (busy) return;
    busy = true;
    document.body.classList.add("playing");

    answer.src = src(file);
    answer.muted = false;
    answer.currentTime = 0;

    answer.play().then(() => {
      answer.classList.add("visible");
      fadeVolume(bg, 0, FADE_MS);                 // приглушаем фон под голос
    }).catch(backToIdle);
  }

  function backToIdle() {
    answer.classList.remove("visible");
    document.body.classList.remove("playing");
    if (soundUnlocked) fadeVolume(bg, BG_VOLUME, FADE_MS);
    setTimeout(() => {
      answer.pause();
      answer.removeAttribute("src");
      answer.load();
      busy = false;
    }, FADE_MS);
  }

  answer.addEventListener("ended", backToIdle);
  answer.addEventListener("error", () => { if (busy) backToIdle(); });

  buttons.forEach(b => {
    b.addEventListener("pointerdown", () => b.classList.add("pressed"));
    ["pointerup", "pointerleave", "pointercancel"].forEach(e =>
      b.addEventListener(e, () => b.classList.remove("pressed")));
    b.addEventListener("click", () => playAnswer(b.dataset.video));
  });

  // Защита киоска: без контекстного меню, зума и выделения
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  // Если фон вдруг встал (сбой декодера) — перезапускаем
  setInterval(() => { if (bg.paused) bg.play().catch(() => {}); }, 3000);
</script>
</body>
</html>
